apiVersion: v1
kind: Namespace
metadata:
  name: ns-gsp-lab3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-gsp-lab3
  namespace: ns-gsp-lab3
data:
  AMBIENTE: desarrollo
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-gsp-lab3
  namespace: ns-gsp-lab3
type: Opaque
stringData:
  API_KEY: REEMPLAZAR_ANTES_DE_DESPLEGAR
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-gsp-lab3
  namespace: ns-gsp-lab3
  labels:
    app: app-gsp-lab3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-gsp-lab3
  template:
    metadata:
      labels:
        app: app-gsp-lab3
    spec:
      containers:
        - name: app-gsp-lab3
          image: docker.io/odonatafly/tarea-final:gsp-lab3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-gsp-lab3
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-gsp-lab3
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /lab
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /lab
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: svc-gsp-lab3
  namespace: ns-gsp-lab3
spec:
  type: ClusterIP
  selector:
    app: app-gsp-lab3
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
