apiVersion: v1
kind: Pod
spec:
  serviceAccountName: gsp-lab3-deployer
  automountServiceAccountToken: true
  containers:
    - name: node
      image: node:24-alpine
      command:
        - cat
      tty: true
    - name: docker
      image: docker:27-cli
      command:
        - cat
      tty: true
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        - name: DOCKER_TLS_CERTDIR
          value: ""
    - name: docker-daemon
      image: docker:27-dind
      args:
        - --host=tcp://0.0.0.0:2375
        - --host=unix:///var/run/docker.sock
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
    - name: kubectl
      image: alpine/k8s:1.37.0
      command:
        - sh
        - -c
        - cat
      tty: true
