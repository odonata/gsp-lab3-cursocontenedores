apiVersion: v1
kind: Namespace
metadata:
  name: ns-gsp-lab3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gsp-lab3-deployer
  namespace: jenkins
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gsp-lab3-deployer
  namespace: ns-gsp-lab3
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gsp-lab3-deployer
  namespace: ns-gsp-lab3
subjects:
  - kind: ServiceAccount
    name: gsp-lab3-deployer
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gsp-lab3-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gsp-lab3-namespace-access
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["ns-gsp-lab3"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gsp-lab3-namespace-access
subjects:
  - kind: ServiceAccount
    name: gsp-lab3-deployer
    namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gsp-lab3-namespace-access
